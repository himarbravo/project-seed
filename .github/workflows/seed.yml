name: Seed

# Only exists in the template: scripts/init_project.py deletes this file.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Initialise a test project
        run: python3 scripts/init_project.py demo-app --owner someone --author "Ada" --description "A demo."
      - name: No traces of the placeholder name remain
        run: "! grep -rnE 'my[-_]project|My Project|OWNER|\bAUTHOR\b|seed:' --exclude-dir=.git ."
      - run: pip install -e ".[dev]"
      - run: ./scripts/check.sh
      - run: demo-app
